<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuRuS Project | Official</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-wrap">
            <div class="logo" onclick="showSection('home')">HuRuS<span>PROJECT</span></div>
            <nav>
                <button onclick="showSection('home')" id="nav-home" class="active">Сервера</button>
                <button onclick="showSection('tasks')" id="nav-tasks">Задания</button>
                <button onclick="showSection('cases')" id="nav-cases">Кейсы</button>
                <button onclick="showSection('shop')" id="nav-shop">Магазин</button>
                <button onclick="showSection('admin')" id="adminLink" style="display: none;">Панель Staff</button>
            </nav>
            <div id="authZone">
                <button class="btn btn-primary" onclick="openModal('authModal')">Войти</button>
            </div>
        </div>
    </header>

    <main class="container main-grid">
        <section class="content">
            
            <div id="home" class="page-section active">
                <h1 class="section-title">Сервера HuRuS</h1>
                <div id="serverList" class="grid">
                    <div class="card">HuRuS MIRAGE #1 (12/20)</div>
                    <div class="card">HuRuS AWP LEGO (8/16)</div>
                </div>
            </div>

            <div id="tasks" class="page-section">
                <h1 class="section-title">Задания</h1>
                <div class="grid" id="taskList"></div>
            </div>

            <div id="cases" class="page-section">
                <h1 class="section-title">Кейсы</h1>
                <div class="case-container card">
                    <div class="case-info">
                        <h3>HuRuS Mystery Box</h3>
                        <p>Цена: 50 ₽</p>
                    </div>
                    <div id="caseDisplay" class="case-roll">?</div>
                    <button class="btn btn-primary w-100" onclick="openCase()">Открыть</button>
                    <div class="inventory-title">Твой инвентарь:</div>
                    <div id="inventory" class="inventory-grid"></div>
                </div>
            </div>

            <div id="shop" class="page-section">
                <h1 class="section-title">Магазин</h1>
                <div class="grid">
                    <div class="card item-card">
                        <div class="item-badge">CS2</div>
                        <h3>Разбан</h3>
                        <p class="price">300 ₽</p>
                        <button class="btn btn-primary w-100">Купить</button>
                    </div>
                </div>
            </div>

            <div id="admin" class="page-section">
                <h1 class="section-title red">Staff Control</h1>
                <div class="card" style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Игрок</th>
                                <th>Баланс</th>
                                <th>Выдать ₽</th>
                                <th>Роль</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="adminUserList"></tbody>
                    </table>
                </div>
                <div id="wipeZone" style="display: none;">
                    <button class="btn btn-danger" onclick="wipeDatabase()" style="margin-top: 20px;">Вайп всех игроков</button>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="chat-wrapper">
                <div class="chat-header">Global Live Chat</div>
                <div id="chatMessages" class="chat-body"></div>
                <div class="chat-footer">
                    <input type="text" id="chatInput" placeholder="Сообщение...">
                    <button onclick="sendChatMessage()">➔</button>
                </div>
            </div>
        </aside>
    </main>

    <div id="authModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-card">
            <div class="modal-tabs">
                <button id="tab-login" class="active" onclick="setAuthMode('login')">Вход</button>
                <button id="tab-reg" onclick="setAuthMode('reg')">Регистрация</button>
            </div>
            <div class="modal-form">
                <input type="text" id="authLogin" placeholder="Никнейм">
                <input type="password" id="authPass" placeholder="Пароль">
                <button class="btn btn-primary w-100" onclick="handleAuth()" id="authBtn">Продолжить</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
